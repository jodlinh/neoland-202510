    <script>
        function Collection() {
            this.count = 0
        }

        Collection.prototype.add = function (item) {
            this[this.count] = item
            this.count++
        }

        Collection.prototype.remove = function (item) {
            for (var i = 0; i < this.count; i++)
                if (this[i] === item)
                    delete this[i]
        }

        Collection.prototype.removeFirst = function (item) {
            for (var i = 0; i < this.count; i++)
                if (this[i] === item) {
                    delete this[i]

                    return
                }
        }

        Collection.prototype.update = function (target, replacement) {
            for (var i = 0; i < this.count; i++)
                if (this[i] === target)
                    this[i] = replacement
        }

        Collection.prototype.updateFirst = function (target, replacement) {
            for (var i = 0; i < this.count; i++)
                if (this[i] === target) {
                    this[i] = replacement

                    return
                }
        }

        Collection.prototype.push = function (item) {
            this[this.count] = item
            this.count++

            return this.count
        }

        Collection.prototype.pop = function () {
            const lastItem = this[this.count - 1]
            delete this[this.count - 1]
            this.count--

            return lastItem
        }

        Collection.prototype.shift = function () {


            const firstItem = this[0]

            for (let i = 1; i < this.count; i++) {
                const item = this[i]

                this[i - 1] = item
            }

            this.count--

            delete this[this.count]

            return firstItem
        }



        Collection.prototype.include = function (searchItem, fromIndex) {

            if (fromIndex === undefined) fromIndex = 0
            else if (fromIndex < 0) fromIndex = this.count + fromIndex

            for (let i = fromIndex; i < this.count; i++) {
                const item = this[i]

                if (item === searchItem) return true
            }
            return false

        }
