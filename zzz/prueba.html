<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <title>Arcade Game</title>
</head>

<body style="background-color: #000; margin: 0; overflow: hidden;">
    <script>
        let pacmanX = 50, pacmanY = 150, pacmanWidth = 100, pacmanHeight = 100
        let ghostX = 800, ghostY = 150, ghostWidth = 50, ghostHeight = 55, ghostLife = 5
        const step = 10
        let loser = false


        const gameBoard = document.createElement('div')
        gameBoard.style.width = '1024px'
        gameBoard.style.height = '768px'
        gameBoard.style.position = 'absolute'
        gameBoard.style.backgroundColor = '#222'
        gameBoard.style.border = '2px solid white'
        gameBoard.style.boxShadow = '0 0 10px violet'
        gameBoard.style.marginLeft = '0px'
        gameBoard.style.marginTop = '0px'
        gameBoard.style.paddingTop = '0px'
        document.body.appendChild(gameBoard)


        //Panel life
        const panel = document.createElement('div')
        panel.style.width = '100%'
        panel.style.height = '60px'
        panel.style.top = '0'
        panel.style.left = '0'
        panel.style.position = 'absolute'

        gameBoard.appendChild(panel)

        // Ghost Lifes 
        const lifes = document.createElement('div')
        lifes.innerText = 'Lifes: ' + ghostLife
        lifes.style.color = '#fff'
        lifes.style.backgroundColor = '#8b0000'
        lifes.style.width = '40%'
        lifes.style.height = '100%'
        lifes.style.position = 'absolute'
        lifes.style.left = '10px'
        lifes.style.top = '0'
        lifes.style.display = 'flex'
        lifes.style.alignItems = 'center'
        lifes.style.paddingLeft = '10px'
        lifes.style.fontFamily = 'monospace'
        lifes.style.fontSize = '20px'
        lifes.style.border = '2px solid #ff0000'
        lifes.style.boxShadow = '0 0 8px #ff0000'
        panel.appendChild(lifes)



        //pacman
        const pacman = document.createElement('div')
        pacman.style.width = pacmanWidth + 'px'
        pacman.style.height = pacmanHeight + 'px'
        pacman.style.position = 'absolute'
        pacman.style.backgroundColor = 'transparent'
        pacman.style.top = pacmanY + 'px'
        pacman.style.left = pacmanX + 'px'
        pacman.style.borderRadius = '50%'
        pacman.style.zIndex = 500
        pacman.style.padding = 0
        pacman.style.margin = 0
        gameBoard.appendChild(pacman)

        //pacmanHeadTop
        const pacmanHeadTop = document.createElement('div')
        pacmanHeadTop.style.position = 'absolute'
        pacmanHeadTop.style.top = '0px'
        pacmanHeadTop.style.left = '0px'
        pacmanHeadTop.style.width = '100px'
        pacmanHeadTop.style.height = '50px'
        pacmanHeadTop.style.background = 'yellow'
        pacmanHeadTop.style.borderTopLeftRadius = '100px'
        pacmanHeadTop.style.borderTopRightRadius = '100px'
        pacmanHeadTop.style.borderBottomLeftRadius = '0'
        pacmanHeadTop.style.borderBottomRightRadius = '0'
        pacmanHeadTop.style.transform = 'rotate(-25deg)'
        pacman.appendChild(pacmanHeadTop)

        const pacmanEye = document.createElement('div')
        pacmanEye.style.width = '20px'
        pacmanEye.style.height = '20px'
        pacmanEye.style.position = 'absolute'
        pacmanEye.style.backgroundColor = 'black'
        pacmanEye.style.top = '15px'
        pacmanEye.style.left = '40px'
        pacmanEye.style.borderRadius = '50%'
        pacman.appendChild(pacmanEye)

        const pacmanPupil = document.createElement('div')
        pacmanPupil.style.width = '10px'
        pacmanPupil.style.height = '10px'
        pacmanPupil.style.position = 'absolute'
        pacmanPupil.style.backgroundColor = 'white'
        pacmanPupil.style.top = '5px'
        pacmanPupil.style.right = '2px'
        pacmanPupil.style.borderRadius = '50%'
        pacmanEye.appendChild(pacmanPupil)

        //pacmanHeadBottom
        const pacmanHeadBottom = document.createElement('div')
        pacmanHeadBottom.style.position = 'absolute'
        pacmanHeadBottom.style.bottom = '0px'
        pacmanHeadBottom.style.left = '0px'
        pacmanHeadBottom.style.width = '100px'
        pacmanHeadBottom.style.height = '50px'
        pacmanHeadBottom.style.background = 'yellow'
        pacmanHeadBottom.style.borderTopLeftRadius = '0'
        pacmanHeadBottom.style.borderTopRightRadius = '0'
        pacmanHeadBottom.style.borderBottomLeftRadius = '100px'
        pacmanHeadBottom.style.borderBottomRightRadius = '100px'
        pacmanHeadBottom.style.transform = 'rotate(25deg)'
        pacman.appendChild(pacmanHeadBottom)

        //GHOST
        const ghost = document.createElement('div')
        ghost.style.width = ghostWidth + 'px'
        ghost.style.height = ghostHeight + 'px'
        ghost.style.backgroundColor = 'red'
        ghost.style.position = 'absolute'
        ghost.style.top = ghostY + 'px'
        ghost.style.left = ghostX + 'px'
        ghost.style.padding = 0
        ghost.style.margin = 0
        ghost.style.borderTopLeftRadius = '50%'
        ghost.style.borderTopRightRadius = '60%'
        ghost.style.borderBottomRightRadius = '5%'
        ghost.style.borderBottomLeftRadius = '5%'
        gameBoard.appendChild(ghost)

        //GHOST EYE
        var ghostEye = function (pos) {
            const ghostEye = document.createElement('div')
            ghostEye.style.position = 'absolute'
            ghostEye.style.top = '10px'
            ghostEye.style.left = pos + 'px'
            ghostEye.style.width = '15px'
            ghostEye.style.height = '19px'
            ghostEye.style.backgroundColor = 'black'
            ghostEye.style.borderRadius = '50%'

            const pupil = document.createElement('div')
            pupil.style.position = 'absolute'
            pupil.style.top = '5px'
            pupil.style.left = '0px'
            pupil.style.width = '9px'
            pupil.style.height = '10px'
            pupil.style.backgroundColor = 'white'
            pupil.style.borderRadius = '50%'
            ghostEye.appendChild(pupil)

            return ghostEye
        }
        var leftEye = new ghostEye(4)
        var rightEye = new ghostEye(25)
        ghost.appendChild(leftEye)
        ghost.appendChild(rightEye)

        //GHOST FOOT 
        var ghostFoot = function (pos) {
            const foot = document.createElement('div')
            foot.style.position = 'absolute'
            foot.style.bottom = '0'
            foot.style.left = pos + 'px'
            foot.style.width = '9px'
            foot.style.height = '7px'
            foot.style.backgroundColor = 'black'
            foot.style.borderTopLeftRadius = '50%'
            foot.style.borderTopRightRadius = '50%'
            return foot
        }
        var foot1 = new ghostFoot(7)
        var foot2 = new ghostFoot(21)
        var foot3 = new ghostFoot(35)

        ghost.appendChild(foot1)
        ghost.appendChild(foot2)
        ghost.appendChild(foot3)


        //game over msj
        const gameOver = document.createElement('div')
        gameOver.innerText = 'Game Over'
        gameOver.style.fontFamily = 'monospace'
        gameOver.style.color = 'red'
        gameOver.style.fontWeight = '900'
        gameOver.style.left = '50%'
        gameOver.style.top = '50%'
        gameOver.style.transform = 'translate(-50%, -50%)'
        gameOver.style.fontSize = '100px'
        gameOver.style.position = 'absolute'
        gameOver.style.textShadow = '0 0 10px blue'

        // CONTROLS
        document.addEventListener('keydown', function (event) {
            if (loser == true) return false
            //ghost 
            //Movements        
            if (event.key === 'ArrowUp') ghostY -= step
            else if (event.key === 'ArrowDown') ghostY += step
            else if (event.key === 'ArrowLeft') ghostX -= step
            else if (event.key === 'ArrowRight') ghostX += step

            let ghostXMax = ghostX + ghostWidth
            let ghostYMax = ghostY + ghostHeight

            //Screen limits
            if (ghostXMax >= 1024)
                ghostX = 963
            if (ghostX <= 4)
                ghostX = 4
            if (ghostY <= 70)
                ghostY = 70
            if (ghostY >= 714)
                ghostY = 714

            //Make movement
            ghost.style.top = ghostY + 'px'
            ghost.style.left = ghostX + 'px'


            //pacman
            //Movements and rotate
            if (event.key === 'w') {
                pacmanY -= step
                pacman.style.transform = 'rotate(-90deg)'
            } else if (event.key === 's') {
                pacmanY += step
                pacman.style.transform = 'rotate(90deg)'
            } else if (event.key === 'a') {
                pacmanX -= step
                pacman.style.transform = 'scaleX(-1)'
            } else if (event.key === 'd') {
                pacmanX += step
                pacman.style.transform = 'rotate(0deg)'
            }

            //Open and close mouth
            if (event.key === 'w' || event.key === 's' || event.key === 'a' || event.key === 'd') {
                if (pacmanHeadTop.style.transform == 'rotate(-25deg)') {
                    pacmanHeadTop.style.transform = 'rotate(-1deg)'
                    pacmanHeadBottom.style.transform = 'rotate(1deg)'
                } else {
                    pacmanHeadTop.style.transform = 'rotate(-25deg)'
                    pacmanHeadBottom.style.transform = 'rotate(25deg)'
                }
            }

            let pacmanXMax = pacmanX + pacmanWidth
            let pacmanYMax = pacmanY + pacmanHeight

            //Screen Limits
            if (pacmanXMax >= 1024)
                pacmanX = 920
            if (pacmanX <= 4)
                pacmanX = 4
            if (pacmanY <= 80)
                pacmanY = 80
            if (pacmanY >= 668)
                pacmanY = 668

            //Make movement
            pacman.style.top = pacmanY + 'px'
            pacman.style.left = pacmanX + 'px'


            console.log('- pacmanMax:' + pacmanXMax + ',' + pacmanYMax + ' - ghostMax:' + ghostXMax + ',' + ghostYMax +
                '\n Paman:' + pacmanX + ',' + pacmanY + ' - ghost:' + ghostX + ',' + ghostY)


            if (ghostX >= pacmanX && ghostX <= pacmanXMax && ghostY >= pacmanY && ghostY <= pacmanYMax) {
                loser = true
            }
            if (ghostXMax >= pacmanX && ghostXMax <= pacmanXMax && ghostYMax >= pacmanY && ghostYMax <= pacmanYMax) {
                loser = true
            }
            if (loser === true) {
                ghostLife -= 1


                pacmanX = 50
                pacmanY = 150
                ghostX = 800
                ghostY = 150

                lifes.innerText = 'Life: ' + ghostLife
                ghost.style.backgroundColor = 'gray'

                if (ghostLife === 0) {
                    gameBoard.appendChild(gameOver)
                    return false
                } else {
                    setTimeout(() => {
                        ghost.style.backgroundColor = 'red'
                        pacman.style.top = pacmanY + 'px'
                        pacman.style.left = pacmanX + 'px'

                        ghost.style.top = ghostY + 'px'
                        ghost.style.left = ghostX + 'px'
                        loser = false
                    }, 2000)
                }

            }
        })
    </script>
</body>

</html>
