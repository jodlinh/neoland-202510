<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw</title>
    <style>
        .bg-black{              background-color: black;}
        .bg-white{              background-color: white;}
        .bg-darkolivegreen{     background-color: darkolivegreen;}
        .bg-rgb-crema{          background-color: rgb(238,228,217);}
        .bg-crema-oscura{       background-color: #f5deb3;}
        .bg-blue{               background-color: blue;}
        .bg-red{                background-color: red;}
        .bg-orange{             background-color: orange;}
        .bg-gray{               background-color: gray;}
        .bg-linear-gradient{    background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);        }        
        .bg-burlywood{          background-color: burlywood;}
        .bg-marron-claro{      background-color: #8b4513;}       
        .bg-marron-oscuro{      background-color: #5a2f10;}
        .bg-semiwhite{          background-color: #e0f7fa;}
        .w-0{                   width: 0;}
        .w-20{                  width: 20px;}
        .w-25{                  width: 25px;}
        .w-27{                  width: 27px;}
        .w-30{                  width: 30px;}
        .w-40{                  width: 40px;}
        .w-50{                  width: 50px;} 
        .w-60{                  width: 60px;}
        .w-100{                 width: 100px;}
        .w-170{                 width: 170px;}
        .w-220{                 width: 220px;}
        .w-250{                 width: 250px;}
        .w-300{                 width: 300px;}
        .h-0{                   height: 0;}
        .h-15{                  height: 15px;}
        .h-20{                  height: 20px;}
        .h-40{                  height: 40px;}
        .h-50{                  height: 50px;}
        .h-60{                  height: 60px;}
        .h-70{                  height: 70px;}
        .h-100{                 height: 100px;}
        .h-120{                 height: 120px;}
        .h-150{                 height: 150px;}
        .h-200{                 height: 200px;}
        .h-250{                 height: 250px;}
        .h-300{                 height: 300px;}
        .top-5{                 top: 5px;}
        .top-20{                top:20px;}
        .top-27 {               top:27px;}        
        .top-30{                top:30px;}
        .top-50{                top: 50px;}
        .top-minus-50{          top:-50px;}
        .top-minus-70{          top: -70px;}
        .top-90{                top:90px;}
        .top-minus-90{          top:-90px;}
        .top-100{               top:100px;}
        .top-170{               top:170px;}
        .top-500{               top:500px;}
        .left-10{               left:10px;}
        .left-minus-10{         left: -10px;}
        .left-18{               left:18px;}
        .left-20{               left:20px;}
        .left-25 {              left: 25px;}
        .left-30 {              left: 30px;}
        .left-35{               left: 35px;}
        .left-40{               left:40px;}
        .left-40-percent{       left:40%;}
        .left-50{               left: 50px;}
        .right-10{              right: 10px;}
        .right-30{              right: 30px;}
        .right-50{              right: 50px;}
        .left-minus-100{        left: -100px;}
        .left-108{              left:108px;}  
        .left-500{              left: 500px;}  
        .bottom-0{              bottom:0;}
        .bottom-15{             bottom: 15px;} 
        .bottom-minus-50{       bottom: -50px;}
        .pos-absolute{          position: absolute;}
        .border-solid{          border-style: solid;}
        .border-black{          border-color: black;}
        .border-white{          border-color: white;}
        .border-top-color-white{border-top-color: white;}
        .border-color-marron-claro{   border-color: #8b4513;  }
        .border-color-marron-oscuro{   border-color: #5a2f10;  }
       
        .border-radius-2-percent{   border-radius: 2%;}
        .border-radius-8-percent{   border-radius: 8%;}
        .border-radius-10-percent{  border-radius: 10%;}
        .border-radius-20-px{   border-radius: 20px;}
        .border-radius-40-px{   border-radius: 40px;}
        .border-radius-50-percent{  border-radius: 50%;}
        .border-radius-60-percent{  border-radius: 60%;}
        .border-radius-80-percent{  border-radius: 80%;}        
        .border-bottom-5{       border-bottom: 5px;}
        .border-bottom-70{      border-bottom-width: 70px;}
        .border-buttom-130{     border-bottom: 130px;}
        .border-left-100{       border-left: 100px;}
        .border-left-120{       border-left: 120px;}
        .border-right-100{      border-right: 100px;}
        .border-right-120{      border-right: 120px;}
        .border-top-100{        border-top: 100px; }
        .border-width-1{        border-width: 1px;}
        .border-width-2{        border-width: 2px;}
        .border-top-left-radius-30-percent{         border-top-left-radius: 30%;}
        .border-top-right-radius-30-percent{        border-top-right-radius: 30%;}
        .border-bottom.left-radius-30-percent {     border-bottom-left-radius: 30%;}
        .border-bottom-right-radius-30-percent {    border-bottom-right-radius: 30%;}
        .border-left-color-black{   border-left-color: black;}
        .border-right-color-black{  border-right-color: black;}
        .border-bottom-color-white{ border-bottom-color: white;}
        .border-bottom-color-red{   border-bottom-color: #a52a2a;}

        .border-bottom-style-solid{ border-bottom-style: solid;}
        .border-left-style-solid{   border-left-style: solid;}
        .border-right-style-solid{  border-right-style: solid;}
        .border-top-style-solid{    border-top-style: solid;}

        .border-left-transparent{     border-left-color: transparent;}
        .border-right-transparent{    border-right-color: transparent;}
        .border-top-transparent{      border-top-color: transparent;}
        .border-bottom-transparent{   border-bottom-color: transparent;}

        .border-top-left-radius-5{  border-top-left-radius: 5px;}
        .border-top-right-radius-5{  border-top-right-radius: 5px;}
        .border-bottom-right-radius-0{  border-bottom-right-radius: 0px;}
        .border-bottom-left-radius-0{  border-bottom-left-radius: 0px;} 
        
        

     

        /*house*/
        .house {
            position: absolute;
            width: 220px;
            height: 150px;
            background-color: #f5deb3;
            border: 2px solid #8b4513;
            top: 500px;
            left: 50px;


            & .fireplace {
                position: absolute;
                width: 30px;
                height: 50px;
                background-color: #5a2f10;
                top: -50px
            }

            & .roof {
                position: absolute;
                top: -70px;
                left: -10px;
                width: 0;
                height: 0;
                border-left: 120px solid transparent;
                border-right: 120px solid transparent;
                border-bottom: 70px solid #a52a2a;
            }

            & .door {
                position: absolute;
                bottom: 0;
                left: 40%;
                width: 40px;
                height: 70px;
                background-color: #8b4513;
                border: 2px solid #5a2f10;
                border-radius: 5px 5px 0 0;
            }

            & .window {
                position: absolute;
                top: 30px;
                width: 40px;
                height: 40px;
                background-color: #e0f7fa;
                border: 2px solid #000;
                border-radius: 8px;
            }

            & .window-izq {
                left: 20px;
            }

            & .window-der {
                right: 30px;
            }
        }
    </style>
</head>

<body class="bg-black">
    <div class="w-300 h-300 top-50 left-50 pos-absolute border-radius-20-px bg-linear-gradient">
        <div class="w-250 h-250 bg-burlywood left-25 top-27 pos-absolute border-radius-60-percent">
            <div class="w-60 h-60 pos-absolute border-radius-50-percent bg-burlywood left-30"></div>
            <div class="w-60 h-60 pos-absolute border-radius-50-percent bg-burlywood right-30"></div>
            <div class="w-50 h-50 bg-white pos-absolute top-30 right-50">
                <div class="w-20 h-20 bg-blue pos-absolute top-5 left-20"></div>
            </div>
            <div class="w-50 h-50 bg-white pos-absolute top-30 left-50">
                <div class="w-20 h-20 bg-blue pos-absolute top-5 left-20"></div>
            </div>
            <div class="bg-darkolivegreen border-bottom-5 border-black w-30 h-50 pos-absolute top-90 left-108 border-radius-10-percent">
            </div>
            <div class="bg-red w-170 h-20 pos-absolute top-170 left-40 border-radius-80-percent">
            </div>
        </div>
    </div>

    <div class="w-100 h-300 bg-white left-500 top-100 pos-absolute">      
        <div class="w-100 h-200 bg-white pos-absolute border-radius-50-percent top-minus-90">       
            <div class="pos-absolute bg-gray border-width-1 border-solid border-black h-15 w-25 top-50 left-10 border-bottom-left-radius-30-percent border-top-left-radius-30-percent"></div>            
            <div class="pos-absolute bg-gray border-width-1 border-solid border-black h-15 w-27 top-50 left-35"></div>
            <div class="pos-absolute bg-gray border-width-1 border-solid border-black h-15 w-25 top-50 right-10 border-bottom-right-radius-30-percent border-top-right-radius-30-percent"></div>
        </div>
        <div class="bg-orange w-20 h-50 pos-absolute border-radius-50-percent border-top-100 border-top-style-solid border-top-color-white bottom-minus-50 left-10"></div>
        <div class="bg-orange w-20 h-50 pos-absolute border-radius-50-percent border-top-100 border-top-style-solid border-top-color-white bottom-minus-50  right-10"></div>
        <div class="bg-white w-100 h-100 pos-absolute bottom-15 left-minus-100 border-buttom-130 border-bottom-color-white border-left-100 border-left-color-black border-right-100 border-right-color-black border-radius-2-percent border-bottom-style-solid border-right-style-solid border-left-style-solid">        </div>
        <div class="pos-absolute w-60 h-120 bg-rgb-crema border-radius-10-percent top-20 left-18 border-width-2 border-solid border-black"></div>
    </div>


    <div class="pos-absolute w-220 h-150 bg-crema-oscura border-width-2 border-solid border-color-marron-claro top-500 left-50">
        <div class="pos-absolute w-30 h-50 bg-marron-oscuro top-minus-50"></div>
        <div class="pos-absolute top-minus-70 left-minus-10 w-0 h-0  border-bottom-70 border-bottom-style-solid border-bottom-color-red border-left-120 border-left-style-solid border-left-transparent  border-right-120 border-right-style-solid border-right-transparent"></div>
        <div class="pos-absolute bottom-0 left-40-percent w-40 h-70 bg-marron-claro border-color-marron-oscuro border-solid border-top-left-radius-5 border-top-right-radius-5 border-bottom-right-radius-0 border-bottom-left-radius-0"></div>
        <div class="pos-absolute top-30 w-40 h-40 bg-semiwhite border-width-2 border-solid border-black border-radius-8-percent left-20"></div>
        <div class="pos-absolute top-30 w-40 h-40 bg-semiwhite border-width-2 border-solid border-black border-radius-8-percent right-30"></div>
    </div>
</body>

</html>
